# Build, test and deploy the Flask app to Azure App Service.
# Azure sign-in uses OpenID Connect (OIDC), so there are no stored passwords or secrets
# beyond the three identifiers below.

name: Build and deploy Python app to Azure Web App - ttscott-webapp

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Keep this in step with the Python version set on the App Service.
      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      # App Service builds the app itself (Oryx), so the local venv is not shipped.
      - name: Upload artifact for deployment jobs
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/
            !venv/
            !.git/
            !tests/
            !.pytest_cache/

  deploy:
    # Only deploy from main, never from a pull request.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write # required to request the OIDC token
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_91EF4B3AD1F14AA1B1BD56120565DA5C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_AE52B9EB486C4E9086690CF27A5B6E1B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3F0A514538CF42449898415D60FDC299 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'ttscott-webapp'
          slot-name: 'Production'

      # Fails the run if the new version isn't answering on /health.
      - name: Smoke test
        run: |
          url="${{ steps.deploy-to-webapp.outputs.webapp-url }}/health"
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 20 "$url"; then
              echo
              echo "Smoke test passed on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt failed, waiting 20s for the app to start..."
            sleep 20
          done
          echo "Smoke test failed: $url did not return a healthy response"
          exit 1


          
